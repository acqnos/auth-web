<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />

    <title>Okluse - Sign in</title>
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <a href="/index.html" class="header__brand">Okluse</a>
      <a href="/pages/signup-main.html" class="header__nav">Sign up</a>
    </header>

    <!-- Auth -->
    <main class="auth">
      <div class="auth__container">
        <!-- Auth header -->
        <div class="auth__header">
          <h1>Get into your account</h1>
          <p>Sign in to access, view and update your data, and many more...</p>
        </div>

        <!-- Form -->
        <form action="#" class="form" novalidate>
          <div class="form__fields">
            <!-- Email -->
            <div class="form__group">
              <label for="email" class="form__label">Email address</label>
              <input
                type="email"
                name="email"
                id="email"
                class="form__input"
                placeholder="eg. john.smith@example.com"
                autocomplete="email"
              />
              <p class="form__hint form__hint--hidden"></p>
            </div>

            <!-- Password -->
            <div class="form__group">
              <label for="password" class="form__label">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                class="form__input"
                placeholder="Enter your password"
                autocomplete="current-password"
              />
              <p class="form__hint form__hint--hidden"></p>
            </div>
          </div>

          <!-- Submit button -->
          <div class="form__group">
            <button type="submit" id="button" class="form__button">
              Sign in
            </button>
            <p id="form-status" class="form__status form__status--hidden"></p>
          </div>
        </form>

        <!-- Auth link -->
        <div class="auth__link">
          Don't have an account?
          <a href="/pages/signup-main.html">Create one</a>
        </div>
      </div>
    </main>
  </body>
</html>
